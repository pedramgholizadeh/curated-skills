  <script>
    (function () {
      "use strict";

      document.querySelectorAll("[data-icon]").forEach(function (n) {
        n.innerHTML = window.icon(n.getAttribute("data-icon"));

      document.querySelectorAll("[data-text]").forEach(function (n) {
        var text = n.getAttribute("data-text");

          var s = document.createElement("span");
          s.className = "ch";

      var tl = gsap.timeline({ paused: true });

      function enter(sel, at) {
        tl.fromTo(sel, { opacity: 0, y: 22, filter: "blur(10px)" },
          { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.5, ease: "expo.out" }, at);
      }
      function leave(sel, at) {

          { opacity: 0, y: -16, filter: "blur(8px)", duration: 0.4, ease: "power3.in" }, at);
      }
      function drift(sel, at, dur) {
        tl.fromTo(sel + " .caustic", { x: -16, y: -10 }, { x: 20, y: 10, duration: dur, ease: "sine.inOut" }, at);
        tl.fromTo(sel + " .sheen", { x: -340 }, { x: 760, duration: 1.1, ease: "power2.inOut" }, at + 0.35);
      }

      /* beat 1 */
      enter(".b1 .glass", 0.5);
      drift(".b1", 0.5, 6.4);

          { opacity: 1, duration: 0.34 }, { opacity: 0, duration: 0.34 },
