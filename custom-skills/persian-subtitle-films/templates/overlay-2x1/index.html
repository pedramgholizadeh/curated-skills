<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=960" />
    <title>Overlay — transparent 2:1</title>
    <link
      rel="preload"
      href="assets/fonts/vazirmatn-arabic-100-900.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="stylesheet" href="assets/fonts/vazirmatn.css" />
    <script src="assets/vendor/gsap.min.js"></script>
    <script src="assets/hypermotion.js"></script>
    <script src="modules/icons.js"></script>
    <style>
      :root {
        --color-ink: #ffffff;
        --color-ink-muted: rgba(255, 255, 255, 0.58);
        --color-accent: #55e6a5;
        --color-micro: #e8fe51;
        --font-fa: "Vazirmatn";
      }

      * { margin: 0; padding: 0; box-sizing: border-box; }

      html,
      body {
        width: 1920px;
        height: 960px;
        overflow: hidden;
        background: transparent;
        color: var(--color-ink);
        font-family: var(--font-fa), sans-serif;
        -webkit-font-smoothing: antialiased;
        text-rendering: geometricPrecision;
      }

      #root {
        position: relative;
        width: 1920px;
        height: 960px;
        overflow: hidden;
        background: transparent;
      }

      .scene-host { position: absolute; inset: 0; }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="13.8"
      data-width="1920"
      data-height="960"
      data-fps="30"
    >
      <div
        id="overlays-host"
        class="scene-host"
        data-composition-id="overlays"
        data-composition-src="compositions/overlays.html"
        data-start="0"
        data-duration="13.8"
        data-width="1920"
        data-height="960"
        data-track-index="10"
        style="background: transparent"
      ></div>

      <audio id="sfx-40" class="clip" data-start="0.4" data-duration="1.6" data-volume="0.42" data-track-index="40" src="assets/audio/whoosh-fast.mp3"></audio>
      <audio id="sfx-41" class="clip" data-start="0.5" data-duration="1.8" data-volume="0.38" data-track-index="41" src="assets/audio/glass-hit-cine.mp3"></audio>
      <audio id="sfx-42" class="clip" data-start="7.8" data-duration="0.8" data-volume="0.4" data-track-index="42" src="assets/audio/whoosh-fast.mp3"></audio>
      <audio id="sfx-43" class="clip" data-start="8.3" data-duration="1.85" data-volume="0.38" data-track-index="43" src="assets/audio/typewriter-digital.mp3"></audio>
      <audio id="sfx-44" class="clip" data-start="9.4" data-duration="0.5" data-volume="0.4" data-track-index="44" src="assets/audio/pop.mp3"></audio>
      <audio id="sfx-45" class="clip" data-start="9.55" data-duration="0.2" data-volume="0.42" data-track-index="45" src="assets/audio/ui-click-tone.mp3"></audio>
    </div>

    <script>
      const tl = gsap.timeline({ paused: true });
      const film = Number(document.getElementById("root").dataset.duration) || 8;
      tl.to({}, { duration: film, ease: "none" }, 0);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
