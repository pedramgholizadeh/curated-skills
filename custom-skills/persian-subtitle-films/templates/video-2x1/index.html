<!doctype html>
<html
  lang="fa"
  dir="rtl"
  data-composition-variables='[
    {"id":"color-ground","type":"color","label":"Background","default":"#1d1d1d"},
    {"id":"color-ink","type":"color","label":"Text","default":"#ffffff"},
    {"id":"color-accent","type":"color","label":"Accent","default":"#55e6a5"},
    {"id":"font-fa","type":"string","label":"Persian font","default":"Vazirmatn"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=960" />
    <title>Persian subtitle film — 2:1</title>
    <link
      rel="preload"
      href="assets/fonts/vazirmatn-arabic-100-900.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="stylesheet" href="assets/fonts/vazirmatn.css" />
    <script src="assets/vendor/gsap.min.js"></script>
    <script src="assets/hypermotion.js"></script>
    <style>
      :root {
        --color-ground: #1d1d1d;
        --color-ground-deep: #181818;
        --color-surface: #232323;
        --color-ink: #ffffff;
        --color-ink-muted: rgba(255, 255, 255, 0.55);
        --color-ink-faint: rgba(255, 255, 255, 0.32);
        --color-hairline: rgba(255, 255, 255, 0.12);
        --color-accent: #55e6a5;
        --color-accent-deep: #2fb87e;
        --color-accent-wash: rgba(85, 230, 165, 0.16);
        --color-micro: #e8fe51;
        --font-fa: "Vazirmatn";
        --ease-enter: cubic-bezier(0.16, 1, 0.3, 1);
        --ease-move: cubic-bezier(0.65, 0, 0.35, 1);
        --ease-exit: cubic-bezier(0.55, 0, 1, 0.45);
        --safe-x: 192px;
        --safe-y: 96px;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 1920px;
        height: 960px;
        overflow: hidden;
        background: var(--color-ground);
      }

      body {
        color: var(--color-ink);
        font-family: var(--font-fa), sans-serif;
        font-weight: 400;
        -webkit-font-smoothing: antialiased;
        text-rendering: geometricPrecision;
        font-kerning: normal;
      }

      #root {
        position: relative;
        width: 1920px;
        height: 960px;
        overflow: hidden;
        background: var(--color-ground);
      }

      /* ---------- stage: the house texture ---------- */
      .bg-dots,
      .bg-glow,
      .bg-waves {
        position: absolute;
        pointer-events: none;
      }

      .bg-dots {
        inset: -48px;
        background-image: radial-gradient(rgba(255, 255, 255, 0.2) 1.6px, transparent 1.7px);
        background-size: 34px 34px;
        -webkit-mask-image: radial-gradient(ellipse at 50% 45%, #000 0%, transparent 72%);
        mask-image: radial-gradient(ellipse at 50% 45%, #000 0%, transparent 72%);
        opacity: 0.35;
        will-change: transform;
        z-index: 0;
      }

      .bg-glow-a {
        inset: -25%;
        background: radial-gradient(
          circle at 82% 8%,
          rgba(85, 230, 165, 0.18) 0%,
          rgba(85, 230, 165, 0) 42%
        );
        z-index: 0;
      }

      .bg-glow-b {
        inset: -25%;
        background: radial-gradient(
          circle at 12% 96%,
          rgba(85, 230, 165, 0.12) 0%,
          rgba(85, 230, 165, 0) 48%
        );
        z-index: 0;
      }

      .bg-waves {
        left: -200px;
        bottom: -60px;
        width: 2320px;
        height: 440px;
        will-change: transform;
        z-index: 1;
      }

      .scene-host {
        position: absolute;
        inset: 0;
      }

      #title-host {
        z-index: 10;
      }

      #captions-host {
        z-index: 20;
      }

      #endcard-host {
        z-index: 30;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="8"
      data-width="1920"
      data-height="960"
      data-fps="30"
    >
      <div id="bg-glow-a" class="bg-glow bg-glow-a" data-layout-ignore></div>
      <div id="bg-glow-b" class="bg-glow bg-glow-b" data-layout-ignore></div>
      <div id="bg-dots" class="bg-dots" data-layout-ignore></div>

      <svg
        id="bg-waves"
        class="bg-waves"
        viewBox="0 0 2320 440"
        preserveAspectRatio="none"
        fill="none"
        data-layout-ignore
        aria-hidden="true"
      >
        <path
          d="M-120 300 C 220 208, 430 372, 780 286 S 1320 196, 1700 286 S 2090 372, 2440 286"
          stroke="#55e6a5"
          stroke-opacity="0.18"
          stroke-width="2"
        />
        <path
          d="M-120 340 C 260 262, 500 402, 820 330 S 1360 250, 1740 330 S 2100 402, 2440 330"
          stroke="#55e6a5"
          stroke-opacity="0.1"
          stroke-width="2"
        />
        <path
          d="M-120 380 C 280 318, 520 430, 860 372 S 1400 300, 1780 372 S 2120 430, 2440 372"
          stroke="#55e6a5"
          stroke-opacity="0.06"
          stroke-width="2"
        />
      </svg>

      <div
        id="title-host"
        class="scene-host"
        data-composition-id="title"
        data-composition-src="compositions/title.html"
        data-start="0"
        data-duration="3.6"
        data-width="1920"
        data-height="960"
        data-track-index="10"
        data-track-kind="graphics"
      ></div>

      <!-- captions:start -->
      <div
        id="captions-host"
        class="scene-host"
        data-composition-id="captions"
        data-composition-src="compositions/captions.html"
        data-start="0"
        data-duration="8"
        data-width="1920"
        data-height="960"
        data-track-index="20"
        data-track-kind="captions"
      ></div>
      <!-- captions:end -->

      <div
        id="endcard-host"
        class="scene-host"
        data-composition-id="endcard"
        data-composition-src="compositions/endcard.html"
        data-start="4.95"
        data-duration="3"
        data-width="1920"
        data-height="960"
        data-track-index="30"
        data-track-kind="graphics"
      ></div>
    </div>

    <script>
      const tl = gsap.timeline({ paused: true });
      const film = Number(document.getElementById("root").dataset.duration) || 8;
      // The stage never stops moving; both drifts are bounded to the film length.
      tl.fromTo("#bg-dots", { x: 0, y: 0 }, { x: -34, y: -17, duration: film, ease: "none" }, 0);
      tl.fromTo("#bg-waves", { x: 0 }, { x: -48, duration: film, ease: "none" }, 0);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
