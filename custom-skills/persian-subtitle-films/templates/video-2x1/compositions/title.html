<template>
  <style>
    #root {
      position: absolute;
      inset: 0;
      overflow: hidden;
    }

    .title-wrap {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: flex-start;
      padding-inline: 192px;
      padding-bottom: 40px;
    }

    .title-kicker-row {
      display: flex;

    }

    .title-kicker {
      color: var(--color-accent);

      letter-spacing: 0;
    }

    .title-rule {
      display: block;

    .title-headline {
      color: var(--color-ink);

    }

    .title-headline .hm-word {
      opacity: 0;
      will-change: transform, opacity, filter;
    }

    .title-accent {
      color: var(--color-accent);
    }

    .title-sub {
      margin-top: 38px;
      color: var(--color-ink-muted);
      font-size: 46px;
      font-weight: 400;
      line-height: 1.5;
      text-align: right;
      opacity: 0;
    }
  </style>

  <div id="root" data-composition-id="title" data-width="1920" data-height="960">
    <div id="title-wrap" class="title-wrap" data-layout-allow-overflow>
      <div id="title-kicker-row" class="title-kicker-row">
        <span id="title-kicker" class="title-kicker">نام برند</span>
        <span id="title-rule" class="title-rule"></span>
      </div>

      <h1 id="title-headline" class="title-headline">کد می‌نویسم، <span class="title-accent">تجربه</span> می‌سازم.</h1>

      <p id="title-sub" class="title-sub">وب‌سایت، سئو و محصول دیجیتال</p>
    </div>
  </div>

  <script>
    const tl = gsap.timeline({ paused: true });

    HM.revealLine(tl, "#title-kicker", { at: 0.2, duration: 0.3 });
    HM.drawRule(tl, "#title-rule", { at: 0.34, duration: 0.35 });
    HM.revealWords(tl, "#title-headline", { at: 0.5, stagger: 0.075, duration: 0.45 });
    HM.revealLine(tl, "#title-sub", { at: 1.05, duration: 0.3 });

    // One hero move: a slow push on the content wrapper, never on a .clip.
    tl.fromTo(
      "#title-wrap",
      { scale: 1 },
      { scale: 1.025, duration: 3.0, ease: "power2.inOut" },
      0.2
    );

    // Exit: one motion, faster than the entrance. The scene runs 3.6 s so the
    // sub line holds past its reading floor before it leaves.
    tl.to(
      "#title-wrap",
      { opacity: 0, y: -12, filter: "blur(6px)", duration: 0.25, ease: "power3.in" },
      3.15
    );

    window.__timelines["title"] = tl;
    tl.seek(0);
  </script>
